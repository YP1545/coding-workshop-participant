# pytest configuration for the backend tests.
#
# Part of: backend / tests.
#
# testpaths keeps a bare "pytest" run to this directory's tests. The coverage
# settings target the shared modules and the four services, which is where all
# the logic lives.

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

[coverage:run]
# The development scripts in _shared are tools, not application code.
omit =
    */tests/*
    */_shared/*_check.py
    */_shared/serve_local.py
    */_shared/seed.py
